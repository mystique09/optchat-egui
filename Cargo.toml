[package]
name = "optchat"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
egui_commonmark = { version = "0.25", default-features = false }
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "links", "x11", "wayland"] }
tokio = { version = "1.53", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
libc = "0.2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
futures-util = "0.3"
keyring = "4.2"
rmcp = { version = "3.5", default-features = false, features = ["client", "auth", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
async-trait = "0.1"
tokio-util = "0.7"
serde_yaml_ng = "0.10"

[dev-dependencies]
keyring-core = "1"
tempfile = "3"
